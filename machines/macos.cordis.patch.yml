# dsh-config · 机器层（macOS）
#
# install.sh 会把本文件做替换后写成 $DSH_HOME/cordis.patch.yml：
#   __DSH_DATA__ → 本机数据根（默认 <本仓库目录>-data，即 ~/.dsh-data）
# 该层对本机所有 profile 生效，且按行覆盖共享层。绝对路径只允许出现在这里。
#
# ── 数据分根（为什么）────────────────────────────────────────────────────
# DSH 默认把所有用户数据放在 $DSH_HOME 下，而 $DSH_HOME 同时是本配置仓库的工作树。
# 因此仓库里的 `git clean -x` 会连会话记录、凭据、附件一起删除。
# 下面 6 行把「不可再生」的数据改写到仓库之外的数据根，
# 使任何 git 命令都无法再触达它们；留在仓库里的只剩配置和可再生产物。
#
# 依据：前 5 个字段是各插件在 bundle 层就已暴露的配置项 ——
#   session-persistence-jsonl.root / attachment-local.dshHome / storage-json.root
#   / credentials-local.path / spill-local.root
# 第 6 个（memory）属于第三方插件 dsh-memory：它自带的默认值是
#   dshHomePath('memory/memory.db')，同样落在 $DSH_HOME 内，因此也必须改写。
#
# 补丁是「整行替换」：这里必须重述该行所需的键（其余键用 schema 默认值）。
- insert:
    - id: playwriter-mcp
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: playwriter
        transport: stdio
        command: /usr/local/bin/node
        args: [ "/Users/jiaxianwang/.local/lib/node_modules/playwriter/bin.js" ]
        cwd: !!js process.env.HOME
        toolCallTimeoutMs: 300000

# ── 数据分根：把不可再生数据指向仓库之外的数据根 ─────────────────────────
- id: session-persistence-jsonl
  name: "@deepseek-ai/dsh-session-persistence-jsonl"
  config:
    root: __DSH_DATA__/sessions

- id: attachment-local
  name: "@deepseek-ai/dsh-attachment-local"
  config:
    dshHome: __DSH_DATA__

- id: storage-json
  name: "@deepseek-ai/dsh-storage-json"
  config:
    root: __DSH_DATA__/storages

- id: credentials
  name: "@deepseek-ai/dsh-credentials-local"
  config:
    path: __DSH_DATA__/.credentials.yaml

- id: spill-local
  name: "@deepseek-ai/dsh-spill-local"
  config:
    root: __DSH_DATA__/spill

# ── 记忆插件 dsh-memory：把长期记忆库也移出仓库工作树 ────────────────────
# 插件未安装时，DSH 会静默忽略这个悬空行（实测），所以可以常驻机器层。
# 安装动作在 install.sh 第 6 步；豁免是「包版本 × DSH 版本」双精确的。
- id: memory
  name: dsh-memory
  config:
    path: __DSH_DATA__/memory/memory.db
    promptRecentCount: 10
    promptMaxChars: 2000
    maxTextChars: 2000
    searchLimitDefault: 10
    searchLimitMax: 50
    promptOrder: 50
